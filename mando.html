<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mando - Yo me la sé</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; padding: 10px; margin: 0; }
        .card { background: #1e1e1e; padding: 12px; border-radius: 12px; margin-bottom: 8px; border: 1px solid #333; }
        button { padding: 15px; border-radius: 50px; border: none; font-weight: bold; width: 100%; font-size: 14px; text-transform: uppercase; margin: 5px 0; }
        input { padding: 12px; width: 90%; border-radius: 8px; margin-bottom: 8px; text-align: center; font-size: 16px; background: #000; color: white; border: 1px solid #333; }
        .btn-green { background: #1DB954; color: white; }
        .btn-red { background: #f44336; color: white; }
        .btn-blue { background: #2196F3; color: white; box-shadow: 0 0 10px gold; }
        .btn-grey { background: #444; color: white; margin: 3px 0; font-size: 12px; }
        .hidden { display: none !important; }
        #pantalla-final { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; justify-content: center; align-items: center; flex-direction: column; }
    </style>
</head>
<body>
    <div id="pantalla-final">
        <h1 id="final-msg">--</h1>
    </div>

    <div id="setup" class="card">
        <h2>Yo me la sé</h2>
        <input type="text" id="salaInput" placeholder="SALA">
        <input type="text" id="nombreInput" placeholder="TU NOMBRE">
        <button class="btn-green" onclick="unirme()">ENTRAR</button>
    </div>

    <div id="juego" class="hidden">
        <div class="card">🪙 Tokens: <span id="valTokens">3</span> | 🎴 <span id="valCartas">1</span></div>
        <button id="btn-hitster" class="btn-blue hidden" onclick="comprarCarta()">HITSTER CARD (3 Tokens)</button>
        <div class="card"><div id="status-msg">Esperando...</div></div>
        <div id="zona-posicion" class="card hidden"></div>
        <div id="zona-robo" class="hidden card">
            <button class="btn-red" onclick="intentarRobar()">ROBAR AÑO (1 Token) 🎯</button>
        </div>
        <div id="zona-voto" class="hidden card">
            <p>¿Adivinó artista/título?</p>
            <button class="btn-green" onclick="enviarVoto(true)">SÍ 👍</button>
            <button class="btn-red" onclick="enviarVoto(false)">NO 👎</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA_WChhOabs671aPhX5uhX3FaLnn_YOc0c",
            authDomain: "party-music-3faae.firebaseapp.com",
            databaseURL: "https://party-music-3faae-default-rtdb.firebaseio.com",
            projectId: "party-music-3faae",
            storageBucket: "party-music-3faae.firebasestorage.app",
            messagingSenderId: "877613370267",
            appId: "1:877613370267:web:f096e520df8a350ba86f3e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let miId = "", misTokens = 3, miLinea = [2000], salaActual = "", pendiente = null, idTurnoGlobal = "";

        function unirme() {
            salaActual = document.getElementById('salaInput').value.toUpperCase();
            const n = document.getElementById('nombreInput').value;
            miId = "p_" + Date.now();
            db.ref(`salas/${salaActual}/jugadores/${miId}`).set({ nombre: n, tokens: 3, linea: [2000] });
            document.getElementById('setup').classList.add('hidden');
            document.getElementById('juego').classList.remove('hidden');
            escucharJuego();
        }

        function escucharJuego() {
            db.ref(`salas/${salaActual}/estado_juego`).on('value', (snap) => {
                const e = snap.val(); if(!e) return;
                idTurnoGlobal = e.turno_de;

                if(e.fase === "JUGANDO") {
                    document.getElementById('zona-voto').classList.add('hidden');
                    if(e.turno_de === miId) {
                        document.getElementById('status-msg').innerText = "⭐ TU TURNO";
                        dibujarLinea(miLinea, "zona-posicion", true);
                    } else {
                        document.getElementById('status-msg').innerText = "Turno de " + e.nombre_turno;
                        document.getElementById('zona-posicion').classList.add('hidden');
                    }
                }

                if(e.fase === "ESPERA_ROBO") {
                    document.getElementById('zona-posicion').classList.add('hidden');
                    if(e.turno_de !== miId) {
                        document.getElementById('status-msg').innerText = "¡¿ROBAS A "+e.nombre_turno+"?!";
                        document.getElementById('zona-robo').classList.remove('hidden');
                    }
                }

                if(e.revelar) {
                    document.getElementById('zona-robo').classList.add('hidden');
                    if(pendiente) {
                        miLinea.push(pendiente);
                        db.ref(`salas/${salaActual}/jugadores/${miId}/linea`).set(miLinea);
                        pendiente = null;
                    }
                    if(e.turno_de !== miId) document.getElementById('zona-voto').classList.remove('hidden');
                }
            });

            db.ref(`salas/${salaActual}/jugadores`).on('value', (snap) => {
                const js = snap.val();
                if(js[miId]) {
                    misTokens = js[miId].tokens;
                    miLinea = js[miId].linea || [2000];
                    document.getElementById('valTokens').innerText = misTokens;
                    document.getElementById('valCartas').innerText = miLinea.length;
                    document.getElementById('btn-hitster').className = misTokens >= 3 ? "btn-blue" : "hidden";
                }
            });
        }

        function dibujarLinea(linea, divId, esPropia) {
            const cont = document.getElementById(divId);
            cont.classList.remove('hidden'); cont.innerHTML = "";
            let años = [...new Set(linea)].sort((a,b)=>a-b);
            for(let i=0; i<=años.length; i++) {
                cont.innerHTML += `<button class="btn-grey" onclick="colocar(${i}, ${JSON.stringify(años)})">Poner aquí</button>`;
                if(i < años.length) cont.innerHTML += `<div>📅 ${años[i]}</div>`;
            }
        }

        function intentarRobar() {
            if(misTokens < 1) return alert("No tokens");
            // Obtenemos la línea del jugador en turno para intentar robarle
            db.ref(`salas/${salaActual}/jugadores/${idTurnoGlobal}/linea`).once('value', (snap) => {
                const lineaEnemiga = snap.val() || [2000];
                dibujarLinea(lineaEnemiga, "zona-posicion", false);
                document.getElementById('zona-robo').classList.add('hidden');
                misTokens--;
                db.ref(`salas/${salaActual}/jugadores/${miId}/tokens`).set(misTokens);
            });
        }

        function colocar(idx, lista) {
            document.getElementById('zona-posicion').classList.add('hidden');
            db.ref(`salas/${salaActual}/estado_juego/cancion_actual`).once('value', (s) => {
                const y = s.val().y;
                let inf = idx === 0 ? 0 : lista[idx-1];
                let sup = idx === lista.length ? 3000 : lista[idx];
                if(y >= inf && y <= sup) {
                    pendiente = y;
                    alert("Acierto provisional...");
                } else { alert("Error..."); }
                if(idTurnoGlobal === miId) db.ref(`salas/${salaActual}/estado_juego/fase`).set("ESPERA_ROBO");
            });
        }

        function comprarCarta() {
            let nt = misTokens - 3;
            db.ref(`salas/${salaActual}/jugadores/${miId}/tokens`).set(nt);
            db.ref(`salas/${salaActual}/estado_juego/cancion_actual`).once('value', (s) => {
                miLinea.push(s.val().y);
                db.ref(`salas/${salaActual}/jugadores/${miId}/linea`).set(miLinea);
                db.ref(`salas/${salaActual}/estado_juego/revelar`).set(true);
            });
        }

        function enviarVoto(v) {
            db.ref(`salas/${salaActual}/estado_juego/votos/${miId}`).set(v);
            document.getElementById('zona-voto').classList.add('hidden');
        }
    </script>
</body>
</html>
