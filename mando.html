<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mando - Yo me la sé</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; padding: 10px; margin: 0; }
        .card { background: #1e1e1e; padding: 12px; border-radius: 12px; margin-bottom: 8px; border: 1px solid #333; }
        button { padding: 15px; border-radius: 50px; border: none; font-weight: bold; width: 100%; font-size: 14px; text-transform: uppercase; margin: 5px 0; cursor: pointer; }
        input { padding: 12px; width: 80%; border-radius: 8px; margin-bottom: 8px; text-align: center; font-size: 16px; background: #000; color: white; border: 1px solid #333; }
        .btn-green { background: #1DB954; color: white; }
        .btn-red { background: #f44336; color: white; }
        .btn-blue { background: #2196F3; color: white; border: 2px solid gold; box-shadow: 0 0 10px gold; }
        .btn-grey { background: #444; color: white; }
        .bloqueado { background: #b71c1c !important; opacity: 0.5; cursor: not-allowed; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="setup" class="card">
        <h2>Yo me la sé</h2>
        <input type="text" id="salaI" placeholder="SALA">
        <input type="text" id="nombreI" placeholder="TU NOMBRE">
        <button class="btn-green" onclick="unirme()">ENTRAR</button>
        <p id="error-msg" style="color: #f44336; font-size: 12px;"></p>
    </div>

    <div id="juego" class="hidden">
        <div class="card" style="display:flex; justify-content:space-around; font-weight: bold;">
            <div>🪙 <span id="tokensV">--</span></div>
            <div>🎴 <span id="cartasV">--</span></div>
        </div>

        <button id="btn-hitster" class="btn-blue hidden" onclick="comprarCarta()">¡YO ME LA SÉ! (3 Tokens) ⚡</button>

        <div class="card" id="status-msg">Conectando...</div>
        <div id="zona-posicion" class="card hidden"></div>
        
        <div id="zona-robo" class="hidden card">
            <button class="btn-red" onclick="intentarRobar()">ROBAR (1 Token) 🎯</button>
        </div>

        <div id="zona-voto" class="hidden card">
            <p>¿Adivinó artista/título?</p>
            <div style="display: flex; gap: 10px;">
                <button class="btn-green" onclick="votar(true)">SÍ 👍</button>
                <button class="btn-red" onclick="votar(false)">NO 👎</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyA_WChhOabs671aPhX5uhX3FaLnn_YOc0c", authDomain: "party-music-3faae.firebaseapp.com", databaseURL: "https://party-music-3faae-default-rtdb.firebaseio.com", projectId: "party-music-3faae", storageBucket: "party-music-3faae.firebasestorage.app", messagingSenderId: "877613370267", appId: "1:877613370267:web:f096e520df8a350ba86f3e" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let miId, misT, miL = [2000], salaA, pend = null, miNombre = "";

        // Al cargar, ver si hay sesión previa
        window.onload = () => {
            const savedId = localStorage.getItem('hitster_id');
            const savedSala = localStorage.getItem('hitster_sala');
            const savedName = localStorage.getItem('hitster_nombre');
            if(savedId && savedSala) {
                document.getElementById('salaI').value = savedSala;
                document.getElementById('nombreI').value = savedName;
            }
        };

        function unirme() {
            salaA = document.getElementById('salaI').value.toUpperCase().trim();
            miNombre = document.getElementById('nombreI').value.trim();
            const err = document.getElementById('error-msg');
            if(!salaA || !miNombre) return;

            db.ref(`salas/${salaA}/jugadores`).once('value', (snap) => {
                const jugadores = snap.val() || {};
                let idEncontrado = null;

                // 1. Verificar si el nombre ya existe
                for(let id in jugadores) {
                    if(jugadores[id].nombre.toLowerCase() === miNombre.toLowerCase()) {
                        idEncontrado = id;
                        break;
                    }
                }

                // 2. Lógica de re-entrada o nombre duplicado
                const savedId = localStorage.getItem('hitster_id');
                if(idEncontrado && idEncontrado !== savedId) {
                    err.innerText = "Este nombre ya está en uso.";
                    return;
                }

                // 3. Crear o recuperar ID
                miId = idEncontrado || "p_" + Date.now();
                if(!idEncontrado) {
                    db.ref(`salas/${salaA}/jugadores/${miId}`).set({ nombre: miNombre, tokens: 3, linea: [2000] });
                }

                // Guardar en LocalStorage (Cookie moderna)
                localStorage.setItem('hitster_id', miId);
                localStorage.setItem('hitster_sala', salaA);
                localStorage.setItem('hitster_nombre', miNombre);

                document.getElementById('setup').classList.add('hidden');
                document.getElementById('juego').classList.remove('hidden');
                escuchar();
            });
        }

        function escuchar() {
            db.ref(`salas/${salaA}/estado_juego`).on('value', (snap) => {
                const e = snap.val(); if(!e) return;
                
                const btnH = document.getElementById('btn-hitster');
                const zPos = document.getElementById('zona-posicion');
                const zRobo = document.getElementById('zona-robo');
                const zVoto = document.getElementById('zona-voto');

                // FIX: Solo mostrar Hitster Card en tu turno y fase JUGANDO
                btnH.className = (e.fase === "JUGANDO" && e.turno_de === miId && misT >= 3) ? "btn-blue" : "hidden";

                if(e.fase === "JUGANDO") {
                    zVoto.classList.add('hidden');
                    zRobo.classList.add('hidden');
                    if(e.turno_de === miId) { 
                        document.getElementById('status-msg').innerText = "⭐ ¡ES TU TURNO!"; 
                        dibujarL(miL, -1); 
                    } else { 
                        document.getElementById('status-msg').innerText = "Turno de " + e.nombre_turno; 
                        zPos.classList.add('hidden'); 
                    }
                }
                
                if(e.fase === "ESPERA_ROBO") {
                    zPos.classList.add('hidden');
                    if(e.turno_de !== miId) { 
                        document.getElementById('status-msg').innerText = "¡ROBA LA CARTA!"; 
                        zRobo.classList.remove('hidden'); 
                    } else {
                        document.getElementById('status-msg').innerText = "Esperando oponentes...";
                    }
                }

                if(e.revelar) {
                    zRobo.classList.add('hidden');
                    zPos.classList.add('hidden');
                    if(pend) { 
                        miL.push(pend); 
                        db.ref(`salas/${salaA}/jugadores/${miId}/linea`).set(miL); 
                        pend = null; 
                    }
                    if(e.turno_de !== miId) zVoto.classList.remove('hidden');
                }
            });

            db.ref(`salas/${salaA}/jugadores/${miId}`).on('value', s => { 
                if(s.val()){ 
                    misT = s.val().tokens; 
                    miL = s.val().linea || [2000]; 
                    document.getElementById('tokensV').innerText = misT; 
                    document.getElementById('cartasV').innerText = miL.length;
                } 
            });
        }

        function dibujarL(linea, bloqIdx) {
            const cont = document.getElementById('zona-posicion');
            cont.classList.remove('hidden'); 
            cont.innerHTML = "";
            let años = [...new Set(linea)].sort((a,b) => a - b);
            
            for(let i=0; i <= años.length; i++) {
                let esBloqueado = (i === bloqIdx);
                let btn = document.createElement("button");
                btn.className = esBloqueado ? "bloqueado" : "btn-grey";
                btn.innerText = esBloqueado ? "OCUPADO" : "COLOCAR AQUÍ";
                if(!esBloqueado) {
                    btn.onclick = () => colocar(i, años);
                }
                cont.appendChild(btn);
                
                if(i < años.length) {
                    let yearDiv = document.createElement("div");
                    yearDiv.style.margin = "5px 0";
                    yearDiv.innerHTML = `📅 <strong>${años[i]}</strong>`;
                    cont.appendChild(yearDiv);
                }
            }
        }

        function intentarRobar() {
            if(misT < 1) return alert("Necesitas 1 Token");
            db.ref(`salas/${salaA}/estado_juego`).once('value', (se) => {
                const e = se.val();
                db.ref(`salas/${salaA}/jugadores/${e.turno_de}/linea`).once('value', (sl) => {
                    dibujarL(sl.val() || [2000], e.posicion_bloqueada);
                    document.getElementById('zona-robo').classList.add('hidden');
                    db.ref(`salas/${salaA}/jugadores/${miId}/tokens`).transaction(t => t - 1);
                });
            });
        }

        function colocar(idx, lista) {
            document.getElementById('zona-posicion').classList.add('hidden');
            db.ref(`salas/${salaA}/estado_juego`).once('value', (se) => {
                const e = se.val();
                const y = e.cancion_actual.y;
                const min = (idx === 0) ? 0 : lista[idx-1];
                const max = (idx === lista.length) ? 3000 : lista[idx];

                if(y >= min && y <= max) {
                    pend = y;
                }

                if(e.turno_de === miId) {
                    db.ref(`salas/${salaA}/estado_juego/posicion_bloqueada`).set(idx);
                    db.ref(`salas/${salaA}/estado_juego/fase`).set("ESPERA_ROBO");
                }
            });
        }

        function comprarCarta() {
            db.ref(`salas/${salaA}/jugadores/${miId}/tokens`).transaction(t => t - 3);
            db.ref(`salas/${salaA}/estado_juego/cancion_actual`).once('value', (s) => {
                miL.push(s.val().y);
                db.ref(`salas/${salaA}/jugadores/${miId}/linea`).set(miL);
                db.ref(`salas/${salaA}/estado_juego/revelar`).set(true);
            });
        }

        function votar(v) { 
            db.ref(`salas/${salaA}/estado_juego/votos/${miId}`).set(v); 
            document.getElementById('zona-voto').classList.add('hidden');
            document.getElementById('status-msg').innerText = "Voto enviado...";
        }
    </script>
</body>
</html>
