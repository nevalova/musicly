<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mando - Yo me la sé</title>
<style>
body { background:#121212; color:white; font-family:'Segoe UI', sans-serif; text-align:center; padding:10px; margin:0; }
.card { background:#1e1e1e; padding:15px; border-radius:15px; margin-bottom:10px; border:1px solid #333; }
input { padding:12px; width:85%; border-radius:8px; margin-bottom:10px; text-align:center; background:#000; color:white; border:1px solid #1DB954; }
button { padding:15px; border-radius:50px; border:none; font-weight:bold; width:100%; margin:5px 0; cursor:pointer; }
.btn-green { background:#1DB954; color:white; }
.btn-red { background:#f44336; color:white; }
.btn-blue { background:#2196F3; border:2px solid gold; color:white; }
.hidden { display:none !important; }
</style>
</head>
<body>

<div id="setup" class="card">
<h2>UNIRSE A SALA</h2>
<input id="salaI" placeholder="CÓDIGO DE SALA">
<input id="nombreI" placeholder="TU NOMBRE">
<button class="btn-green" onclick="unirme()">ENTRAR AL JUEGO</button>
</div>

<div id="juego" class="hidden">
    <div class="card">🪙 <span id="tokensV">--</span> | 🎴 <span id="cartasV">--</span></div>
    
    <button id="btn-spotify" class="btn-green" onclick="abrirSpotify()">▶️ ESCUCHAR EN TU MÓVIL</button>
    
    <button id="btn-hitster" class="btn-blue" onclick="comprarCarta()">¡YO ME LA SÉ! ⚡</button>

    <div class="card"><div id="status-msg">Conectado</div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyA...", // DEJA TU API KEY AQUÍ
    authDomain: "party-music.firebaseapp.com",
    databaseURL: "https://party-music-default-rtdb.firebaseio.com",
    projectId: "party-music"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let miId, salaA, trackActual = null;
let misT = 0;

// Tomar sala del QR
window.onload = () => {
    const params = new URLSearchParams(window.location.search);
    if(params.get('sala')) document.getElementById('salaI').value = params.get('sala');
};

function unirme(){
    salaA = document.getElementById('salaI').value.toUpperCase().trim();
    const nombre = document.getElementById('nombreI').value.trim();
    if(!salaA || !nombre) return alert("Faltan datos");

    miId = "p_" + Date.now();
    db.ref(`salas/${salaA}/jugadores/${miId}`).set({ nombre: nombre, tokens: 3, linea: [2000] });

    document.getElementById('setup').classList.add('hidden');
    document.getElementById('juego').classList.remove('hidden');
    escuchar();
}

function escuchar(){
    db.ref(`salas/${salaA}/estado_juego`).on('value', snap => {
        const e = snap.val();
        if(!e) return;
        
        if(e.cancion_actual){
            trackActual = e.cancion_actual.spotifyId;
        }

        if(e.revelar){
            document.getElementById('btn-spotify').classList.add('hidden');
            document.getElementById('btn-hitster').classList.add('hidden');
        } else {
            document.getElementById('btn-spotify').classList.remove('hidden');
            document.getElementById('btn-hitster').classList.remove('hidden');
        }
        document.getElementById('status-msg').innerText = e.fase || "Jugando";
    });

    db.ref(`salas/${salaA}/jugadores/${miId}`).on('value', s => {
        const d = s.val();
        if(d){
            misT = d.tokens || 0;
            document.getElementById('tokensV').innerText = misT;
            document.getElementById('cartasV').innerText = (d.linea || []).length - 1;
        }
    });
}

function abrirSpotify(){
    if(trackActual) window.location.href = "spotify:track:" + trackActual;
}

function comprarCarta(){
    if(misT < 3) return alert("No tienes tokens");
    db.ref(`salas/${salaA}/jugadores/${miId}/tokens`).transaction(t => (t || 0) - 3);
    db.ref(`salas/${salaA}/estado_juego/revelar`).set(true);
}
</script>
</body>
</html>
