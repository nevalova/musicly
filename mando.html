<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mando Hitster</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; padding: 10px; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #333; }
        button { padding: 15px; border-radius: 50px; border: none; font-weight: bold; cursor: pointer; margin: 5px; width: 95%; font-size: 14px; }
        .btn-green { background: #1DB954; color: white; }
        .btn-red { background: #f44336; color: white; }
        .btn-blue { background: #2196F3; color: white; }
        .btn-grey { background: #444; color: white; margin: 5px 0; }
        .hidden { display: none; }
        .otros-jugadores { font-size: 12px; text-align: left; background: #000; padding: 10px; border-radius: 8px; }
        .linea-mini { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; border-bottom: 1px solid #222; padding-bottom: 5px; }
        .tag-año { background: #eee; color: #000; padding: 2px 5px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="setup" class="card">
        <input type="text" id="salaInput" placeholder="SALA" style="padding:10px; width:80%; margin-bottom:10px;">
        <input type="text" id="nombreInput" placeholder="TU NOMBRE" style="padding:10px; width:80%; margin-bottom:10px;">
        <button class="btn-green" onclick="unirme()">ENTRAR</button>
    </div>

    <div id="juego" class="hidden">
        <div class="card">
            <div id="status-msg">Esperando...</div>
            <div style="color: gold; margin-top: 5px;">🪙 Tokens: <span id="valTokens">3</span></div>
            <button id="btn-hitster" class="btn-blue hidden" onclick="comprarCarta()">COMPRAR CARTA (3 Tokens) ⚡</button>
        </div>

        <div id="zona-otros" class="card otros-jugadores">
            <strong>Líneas de los demás:</strong>
            <div id="lista-otros"></div>
        </div>

        <div id="zona-posicion" class="hidden"></div>
        
        <div id="zona-robo" class="hidden card">
            <p id="msg-robo"></p>
            <button class="btn-red" onclick="intentarRobar()">¡ROBAR AÑO! (Gasta 1 Token) 🎯</button>
        </div>

        <div id="zona-voto" class="hidden card">
            <p>¿Adivinó artista y título?</p>
            <button class="btn-green" onclick="enviarVoto(true)">SÍ 👍</button>
            <button class="btn-red" onclick="enviarVoto(false)">NO 👎</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA_WChhOabs671aPhX5uhX3FaLnn_YOc0c",
            authDomain: "party-music-3faae.firebaseapp.com",
            databaseURL: "https://party-music-3faae-default-rtdb.firebaseio.com",
            projectId: "party-music-3faae",
            storageBucket: "party-music-3faae.firebasestorage.app",
            messagingSenderId: "877613370267",
            appId: "1:877613370267:web:f096e520df8a350ba86f3e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let miId = "", misTokens = 3, miLinea = [2000], salaActual = "", seguro = false;

        const params = new URLSearchParams(window.location.search);
        if(params.has('sala')) document.getElementById('salaInput').value = params.get('sala');

        function unirme() {
            salaActual = document.getElementById('salaInput').value.toUpperCase();
            const n = document.getElementById('nombreInput').value;
            if(!n || !salaActual) return;
            miId = "p_" + Date.now();
            db.ref(`salas/${salaActual}/jugadores/${miId}`).set({ nombre: n, tokens: 3, linea: [2000] });
            document.getElementById('setup').classList.add('hidden');
            document.getElementById('juego').classList.remove('hidden');
            escucharJuego();
        }

        function escucharJuego() {
            // Vigilar estado del juego
            db.ref(`salas/${salaActual}/estado_juego`).on('value', (snap) => {
                const e = snap.val(); if(!e) return;
                seguro = false;
                
                // Botón Hitster (Compra directa)
                const btnH = document.getElementById('btn-hitster');
                if(misTokens >= 3) btnH.classList.remove('hidden');
                else btnH.classList.add('hidden');

                if(e.fase === "JUGANDO") {
                    document.getElementById('zona-voto').classList.add('hidden');
                    if(e.turno_de === miId) {
                        document.getElementById('status-msg').innerText = "⭐ TU TURNO";
                        document.getElementById('zona-robo').classList.add('hidden');
                        dibujarLinea(miLinea, "zona-posicion", true);
                    } else {
                        document.getElementById('status-msg').innerText = "Turno de " + e.nombre_turno;
                        document.getElementById('zona-posicion').classList.add('hidden');
                        document.getElementById('msg-robo').innerText = `${e.nombre_turno} está colocando...`;
                        document.getElementById('zona-robo').classList.remove('hidden');
                    }
                }

                if(e.revelar === true) {
                    document.getElementById('zona-robo').classList.add('hidden');
                    if(e.turno_de !== miId) document.getElementById('zona-voto').classList.remove('hidden');
                }
            });

            // Vigilar a otros jugadores (Líneas de tiempo)
            db.ref(`salas/${salaActual}/jugadores`).on('value', (snap) => {
                const jugadores = snap.val();
                const lista = document.getElementById('lista-otros');
                lista.innerHTML = "";
                for(let id in jugadores) {
                    if(id === miId) { 
                        misTokens = jugadores[id].tokens; 
                        miLinea = jugadores[id].linea || [2000];
                        document.getElementById('valTokens').innerText = misTokens;
                        continue; 
                    }
                    const p = jugadores[id];
                    const lineaHtml = (p.linea || []).sort((a,b)=>a-b).map(a => `<span class="tag-año">${a}</span>`).join(' ');
                    lista.innerHTML += `<div><strong>${p.nombre}:</strong><br><div class="linea-mini">${lineaHtml}</div></div>`;
                }
            });

            // Escuchar Consenso de Votos
            db.ref(`salas/${salaActual}/estado_juego/votos`).on('value', (snap) => {
                const v = snap.val(); if(!v || seguro) return;
                db.ref(`salas/${salaActual}/jugadores`).once('value', (sj) => {
                    const totalJ = Object.keys(sj.val()).length - 1;
                    const vArr = Object.values(v);
                    if(vArr.length >= totalJ && totalJ > 0) {
                        seguro = true;
                        const sies = vArr.filter(x => x === true).length;
                        if(sies > vArr.length/2) procesarResultado(true);
                    }
                });
            });
        }

        function dibujarLinea(linea, divId, esMia) {
            const cont = document.getElementById(divId);
            cont.classList.remove('hidden'); cont.innerHTML = "";
            let años = [...new Set(linea)].sort((a,b)=>a-b);
            for(let i=0; i<=años.length; i++) {
                cont.innerHTML += `<button class="btn-grey" onclick="colocar(${i}, ${JSON.stringify(años)}, ${esMia})">Poner aquí</button>`;
                if(i < años.length) cont.innerHTML += `<div>📅 ${años[i]}</div>`;
            }
        }

        function colocar(idx, lista, esMia) {
            document.getElementById('zona-posicion').classList.add('hidden');
            document.getElementById('zona-robo').classList.add('hidden');
            
            db.ref(`salas/${salaActual}/estado_juego/cancion_actual`).once('value', (s) => {
                const añoReal = s.val().y;
                let inf = idx === 0 ? 0 : lista[idx-1];
                let sup = idx === lista.length ? 3000 : lista[idx];

                if(añoReal >= inf && añoReal <= sup) {
                    alert("¡ACIERTO!");
                    miLinea.push(añoReal);
                    db.ref(`salas/${salaActual}/jugadores/${miId}/linea`).set(miLinea);
                } else { alert("ERROR. El año era " + añoReal); }
                
                db.ref(`salas/${salaActual}/estado_juego/revelar`).set(true);
            });
        }

        function intentarRobar() {
            if(misTokens < 1) return alert("No tienes tokens");
            misTokens--;
            db.ref(`salas/${salaActual}/jugadores/${miId}/tokens`).set(misTokens);
            dibujarLinea(miLinea, "zona-posicion", false);
            document.getElementById('status-msg').innerText = "🎯 ¡INTENTANDO ROBAR!";
        }

        function comprarCarta() {
            if(misTokens < 3) return;
            misTokens -= 3;
            db.ref(`salas/${salaActual}/estado_juego/cancion_actual`).once('value', (s) => {
                miLinea.push(s.val().y);
                db.ref(`salas/${salaActual}/jugadores/${miId}/linea`).set(miLinea);
                db.ref(`salas/${salaActual}/jugadores/${miId}/tokens`).set(misTokens);
                alert("¡Hitster Card usada! Carta añadida automáticamente.");
            });
        }

        function enviarVoto(v) {
            db.ref(`salas/${salaActual}/estado_juego/votos/${miId}`).set(v);
            document.getElementById('zona-voto').classList.add('hidden');
        }

        function procesarResultado(gano) {
            db.ref(`salas/${salaActual}/estado_juego/turno_de`).once('value', (s) => {
                if(s.val() === miId && gano) {
                    misTokens++;
                    db.ref(`salas/${salaActual}/jugadores/${miId}/tokens`).set(misTokens);
                }
            });
        }
    </script>
</body>
</html>
