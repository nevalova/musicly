<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>TV - Yo me la sé</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/* Tu estética original */
body { background:#000; color:white; font-family:sans-serif; text-align:center; padding:20px; margin:0; overflow:hidden; }
#bg-spotify { position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; filter:blur(40px) brightness(0.5); transform:scale(1.2); }
.card { background:rgba(17,17,17,0.9); padding:20px; border-radius:20px; margin:10px auto; max-width:500px; border:1px solid #333; position:relative; z-index:1; }
button { padding:15px; margin:10px; width:90%; border:none; border-radius:10px; font-size:16px; cursor:pointer; }
.btn { background:#1DB954; color:white; }
</style>
</head>
<body>

<div id="bg-spotify"></div>

<h1>🎧 YO ME LA SÉ - TV</h1>

<div class="card">
<h2>Sala: <span id="salaCodigo">----</span></h2>
<canvas id="qr"></canvas>
<p>Escanea para unirte</p>
<p>Código: <strong id="codigoGrande"></strong></p>
</div>

<div class="card">
<button class="btn" onclick="iniciarJuego()">INICIAR</button>
<button class="btn" onclick="siguienteCancion()">SIGUIENTE CANCIÓN</button>
<button class="btn" onclick="revelar()">REVELAR</button>
</div>

<div class="card">
<h2 id="info">Esperando jugadores...</h2>
</div>

<script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script src="canciones.js"></script>

<script>
const firebaseConfig = { apiKey: "AIzaSyA...", authDomain: "party-music.firebaseapp.com", databaseURL: "https://party-music-default-rtdb.firebaseio.com", projectId: "party-music" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let sala = generarSala();
document.getElementById("salaCodigo").innerText = sala;
document.getElementById("codigoGrande").innerText = sala;

const base = window.location.origin + window.location.pathname.replace("index.html", "");
const url = base + "mando.html?sala=" + sala;

QRCode.toCanvas(document.getElementById('qr'), url, err=>{ if(err) console.error(err); });

let indice = 0;

function generarSala(){ return Math.random().toString(36).substring(2,6).toUpperCase(); }

function iniciarJuego(){ indice = 0; siguienteCancion(); }

function siguienteCancion(){
    if(!CANCIONES || CANCIONES.length === 0){ alert("No hay canciones"); return; }
    if(indice >= CANCIONES.length){ indice = 0; }
    const c = CANCIONES[indice];

    db.ref(`salas/${sala}/estado_juego`).set({
        fase: "JUGANDO",
        cancion_actual: { spotifyId: c.spotifyId, y: c.year, t: c.titulo, a: c.artista },
        revelar: false
    });

    // Carga el audio en la TV
    document.getElementById("bg-spotify").innerHTML = `<iframe src="https://open.spotify.com/embed/track/${c.spotifyId}?utm_source=generator&autoplay=1" width="100%" height="100%" frameBorder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>`;
    document.getElementById("info").innerText = "🎵 Escuchando...";
    indice++;
}

function revelar(){
    db.ref(`salas/${sala}/estado_juego/revelar`).set(true);
    const c = CANCIONES[indice - 1];
    document.getElementById("info").innerText = `${c.titulo} - ${c.artista} (${c.year})`;
}

// Escuchar si el mando pide revelar
db.ref(`salas/${sala}/estado_juego/revelar`).on('value', snap => {
    if(snap.val() === true) {
        const c = CANCIONES[indice - 1];
        document.getElementById("info").innerText = `${c.titulo} - ${c.artista} (${c.year})`;
    }
});
</script>
</body>
</html>
