<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yo Me La Sé - TV Mode</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-database-compat.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

    <script src="canciones.js"></script>

    <style>
        body { margin: 0; background: #000; color: white; font-family: 'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
        #yt-player-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; filter: blur(40px) brightness(0.4); transform: scale(1.2); }
        .main-container { z-index: 10; width: 90%; max-width: 1000px; text-align: center; margin-top: 20px; }
        .glass-panel { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 40px; padding: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .sala-tag { background: #1DB954; color: black; font-weight: 900; padding: 5px 20px; border-radius: 50px; display: inline-block; margin-bottom: 10px; font-size: 1.2rem; }
        .btn-admin { background: #1DB954; color: white; border: none; padding: 12px 25px; border-radius: 12px; font-weight: bold; cursor: pointer; margin: 5px; font-size: 1rem; }
        #pantalla-carga { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .loader-spin { font-size: 5rem; animation: rotate 2s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        #revelado-datos { display: none; margin-top: 20px; animation: fadeIn 0.8s ease; }
        .card-jugador { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 15px; min-width: 120px; transition: 0.3s; }
        .card-jugador.activo { border-color: #1DB954; background: rgba(29, 185, 84, 0.1); transform: scale(1.1); }
    </style>
</head>
<body>

    <div id="pantalla-carga">
        <div class="loader-spin">💿</div>
        <div id="texto-carga" style="color: #1DB954; font-size: 2rem; font-weight: 900; margin-top: 20px;">Preparando...</div>
    </div>

    <div id="yt-player-container"><div id="player"></div></div>

    <div class="main-container">
        <div class="sala-tag">CÓDIGO DE SALA: <span id="display-sala-id">----</span></div>
        <div class="glass-panel">
            <h2 id="instruccion">ESCANEEN PARA JUGAR</h2>
            <div id="qr-container"><canvas id="qr-canvas"></canvas></div>
            <div id="revelado-datos">
                <h1 id="display-year" style="font-size: 6rem; margin: 0; color: #FFD700;">----</h1>
                <h2 id="display-song" style="font-size: 2.5rem; margin: 5px 0;">Título</h2>
                <h3 id="display-artist" style="opacity: 0.8; font-weight: 400;">Artista</h3>
            </div>
            <div style="margin-top:20px;">
                <button class="btn-admin" onclick="iniciarJuego()">🚀 SIGUIENTE RONDA</button>
                <button class="btn-admin" style="background:#2196F3;" onclick="revelar()">👁️ REVELAR</button>
            </div>
        </div>
        <div id="contenedor-jugadores" style="display:flex; justify-content:center; gap:15px; flex-wrap:wrap; margin-top:30px;"></div>
    </div>

    <script>
        // 0. VERIFICACIÓN DE CARGA (Para GitHub)
        window.onload = () => {
            if (typeof listaPrueba === 'undefined') {
                console.error("ERROR: No se detecta listaPrueba. Revisa que canciones.js esté en la raíz.");
                alert("Error crítico: No se encontró la lista de canciones.");
            } else {
                console.log("Éxito: " + listaPrueba.length + " canciones cargadas.");
            }
        };

        const firebaseConfig = {
            apiKey: "AIzaSyA_WChhOabs671aPhX5uhX3FaLnn_YOc0c",
            authDomain: "party-music-3faae.firebaseapp.com",
            databaseURL: "https://party-music-3faae-default-rtdb.firebaseio.com",
            projectId: "party-music-3faae",
            storageBucket: "party-music-3faae.firebasestorage.app",
            messagingSenderId: "877613370267",
            appId: "1:877613370267:web:f096e520df8a350ba86f3e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function genSala(l){ 
            let r='', c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; 
            for(let i=0;i<l;i++) r+=c.charAt(Math.floor(Math.random()*c.length)); 
            return r; 
        }
        const urlParams = new URLSearchParams(window.location.search);
        const salaID = (urlParams.get('s') || genSala(4)).toUpperCase();
        document.getElementById('display-sala-id').innerText = salaID;

        db.ref(`salas/${salaID}`).onDisconnect().remove();

        const path = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
        new QRious({
            element: document.getElementById('qr-canvas'),
            value: window.location.origin + path + "mando.html?sala=" + salaID,
            size: 200, level: 'H'
        });

        let player, cancionActualId = "", listaJugadores = [];
        const frasesCarga = ["Afinando guitarras...", "Buscando éxitos...", "Limpiando discos..."];

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', { height: '100%', width: '100%', playerVars: { 'autoplay': 1, 'controls': 0 } });
        }

        function iniciarJuego() {
            if (listaJugadores.length === 0) return alert("Esperando jugadores...");
            const canciones = listaPrueba; // Referencia directa al archivo externo
            
            const pantalla = document.getElementById('pantalla-carga');
            document.getElementById('texto-carga').innerText = frasesCarga[Math.floor(Math.random() * frasesCarga.length)];
            pantalla.style.display = 'flex';

            const rC = canciones[Math.floor(Math.random() * canciones.length)];
            const rJ = listaJugadores[Math.floor(Math.random() * listaJugadores.length)];

            setTimeout(() => {
                db.ref(`salas/${salaID}/estado_juego`).set({
                    fase: "JUGANDO",
                    cancion_actual: { idYT: rC.youtubeId, t: rC.titulo, a: rC.artista, y: rC.year },
                    turno_de: rJ.id,
                    nombre_turno: rJ.nombre,
                    revelar: false
                });
                pantalla.style.display = 'none';
            }, 3000);
        }

        function revelar() { db.ref(`salas/${salaID}/estado_juego/revelar`).set(true); }

        db.ref(`salas/${salaID}/jugadores`).on('value', snap => {
            const container = document.getElementById('contenedor-jugadores');
            const jugadores = snap.val();
            container.innerHTML = ""; listaJugadores = [];
            if(!jugadores) return;
            for (let id in jugadores) {
                listaJugadores.push({ id, nombre: jugadores[id].nombre });
                container.innerHTML += `<div class="card-jugador">
                    <div style="font-size: 1.2rem;">${jugadores[id].linea ? jugadores[id].linea.length : 0} 🎴</div>
                    <div style="font-weight:bold;">${jugadores[id].nombre}</div>
                    <div style="color: #1DB954;">${jugadores[id].tokens} 🪙</div>
                </div>`;
            }
        });

        db.ref(`salas/${salaID}/estado_juego`).on('value', snap => {
            const e = snap.val(); if(!e) return;
            if(e.fase === 'JUGANDO') {
                document.getElementById('instruccion').innerText = "🎶 TURNO DE: " + e.nombre_turno;
                document.getElementById('qr-container').style.display = "none";
                document.getElementById('revelado-datos').style.display = "none";
                if(cancionActualId !== e.cancion_actual.idYT) {
                    cancionActualId = e.cancion_actual.idYT;
                    if(player && player.loadVideoById) player.loadVideoById(cancionActualId);
                }
            }
            if(e.revelar) {
                document.getElementById('revelado-datos').style.display = "block";
                document.getElementById('display-year').innerText = e.cancion_actual.y;
                document.getElementById('display-song').innerText = e.cancion_actual.t;
                document.getElementById('display-artist').innerText = e.cancion_actual.a;
                if(player) player.pauseVideo();
            }
        });
    </script>
</body>
</html>
