<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Yo Me La Sé - TV Mode</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* El fondo de video estilo Bopster */
        #yt-player-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
            filter: blur(25px) brightness(0.6);
            transform: scale(1.2); /* Evita bordes blancos por el blur */
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 40px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            max-width: 80%;
        }

        .revelado {
            display: none;
            margin-top: 20px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .neon-text {
            text-shadow: 0 0 15px rgba(255,255,255,0.7);
            font-size: 4rem;
            margin: 0;
        }
    </style>
</head>
<body>

    <div id="yt-player-container">
        <div id="player"></div>
    </div>

    <div class="glass-panel" id="main-board">
        <h2 id="status">ESPERANDO CANCIÓN...</h2>
        
        <div id="revelado-datos" class="revelado">
            <h1 class="neon-text" id="display-year">1995</h1>
            <h3 id="display-song" style="color: #23a6d5;">Título de la Canción</h3>
            <p id="display-artist">Artista</p>
        </div>
    </div>

    <script>
        // Configura tu Firebase aquí
        const firebaseConfig = {
            databaseURL: "TU_DATABASE_URL"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let player;
        const salaID = "SALA_TEST"; // Cambia esto según tu mando

        // Carga el API de YouTube
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: '', 
                playerVars: { 
                    'autoplay': 1, 
                    'controls': 0, 
                    'showinfo': 0, 
                    'rel': 0,
                    'modestbranding': 1
                }
            });
        }

        // Escucha cambios del mando
        db.ref(`salas/${salaID}/estado`).on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            if (data.accion === 'reproducir') {
                document.getElementById('status').innerText = "🎶 ESCUCHANDO...";
                document.getElementById('revelado-datos').style.display = "none";
                player.loadVideoById(data.youtubeId);
                player.playVideo();
            }

            if (data.accion === 'revelar') {
                document.getElementById('status').innerText = "¡LA RESPUESTA ES!";
                document.getElementById('display-year').innerText = data.year;
                document.getElementById('display-song').innerText = data.titulo;
                document.getElementById('display-artist').innerText = data.artista;
                document.getElementById('revelado-datos').style.display = "block";
            }
        });
    </script>
</body>
</html>
