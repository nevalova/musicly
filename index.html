<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Yo me la sé - TV Central</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { background: #121212; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; overflow: hidden; }
        .header { background: #1DB954; padding: 15px; font-size: 28px; font-weight: bold; text-transform: uppercase; }
        .controles-tv { margin: 15px; padding: 20px; border: 2px solid #1DB954; display: inline-block; border-radius: 20px; background: #1e1e1e; min-width: 400px; }
        
        /* AVISO DE TURNO GRANDE */
        #aviso-turno { font-size: 32px; color: gold; font-weight: bold; margin-bottom: 10px; text-shadow: 0 0 10px rgba(255,215,0,0.4); }
        
        .tablero { display: flex; justify-content: center; gap: 15px; padding: 15px; flex-wrap: wrap; height: 50vh; overflow-y: auto; }
        .jugador { border: 3px solid #333; padding: 10px; border-radius: 12px; background: #252525; min-width: 200px; transition: 0.4s; position: relative; }
        .turno-activo { border-color: #FFD700 !important; box-shadow: 0 0 20px gold; transform: scale(1.05); }
        .linea { display: flex; gap: 5px; justify-content: center; margin-top: 8px; flex-wrap: wrap; }
        .carta { background: #fff; color: #000; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 11px; }
        button { padding: 12px 25px; font-size: 18px; cursor: pointer; background: #1DB954; border: none; color: white; border-radius: 50px; font-weight: bold; margin: 5px; }
        .btn-revelar { background: #f39c12; }
        #reproductor-status { margin: 10px; font-size: 20px; color: #1DB954; }
        .revelado { font-size: 35px; color: gold; font-weight: bold; margin-top: 10px; display: none; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 15px; border: 2px solid gold; }
        #player-invisible { position: absolute; top: -9999px; }
    </style>
</head>
<body>
    <div class="header">🎶 Yo me la sé 🎶</div>
    
    <div class="controles-tv">
        <div id="aviso-turno">ESPERANDO JUGADORES</div>
        <div style="display: flex; gap: 15px; align-items: center; justify-content: center;">
            <div id="qrcode" style="background:white; padding:5px; border-radius:5px;"></div>
            <div>
                <button id="btn-principal" onclick="nuevaRonda()">INICIAR / SIGUIENTE 🚀</button>
                <button id="btn-revelar" class="btn-revelar" style="display:none;" onclick="revelarAño()">REVELAR AÑO ✨</button>
            </div>
        </div>
        <div id="reproductor-status">Escanea el código para unirte</div>
        <div id="revelado-datos" class="revelado"></div>
    </div>

    <div id="player-invisible"></div>
    <div id="tablero-jugadores" class="tablero"></div>

    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-database-compat.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyA_WChhOabs671aPhX5uhX3FaLnn_YOc0c", authDomain: "party-music-3faae.firebaseapp.com", databaseURL: "https://party-music-3faae-default-rtdb.firebaseio.com", projectId: "party-music-3faae", storageBucket: "party-music-3faae.firebasestorage.app", messagingSenderId: "877613370267", appId: "1:877613370267:web:f096e520df8a350ba86f3e" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let miSala = prompt("SALA:").toUpperCase() || "FIESTA";
        db.ref(`salas/${miSala}`).remove();

        new QRCode(document.getElementById("qrcode"), { text: window.location.href.replace("index.html", "") + "mando.html?sala=" + miSala, width: 80, height: 80 });

        let playlist = [
            { t: "September", a: "Earth, Wind & Fire", y: 1978, idYT: "Gs069dndIYk" },
            { t: "Take On Me", a: "a-ha", y: 1984, idYT: "djV11Xbc914" },
            { t: "Beat It", a: "Michael Jackson", y: 1982, idYT: "oRdxUFDoQe0" },
            { t: "Toxic", a: "Britney Spears", y: 2003, idYT: "LOZuxwVk7TU" },
            { t: "Uptown Funk", a: "Bruno Mars", y: 2014, idYT: "OPf0YbXqDm0" },
            { t: "Rayando El Sol", a: "Maná", y: 1990, idYT: "tcWzVUlR7Y4" }
        ];

        let player, indiceTurno = 0, actualId = "";
        function onYouTubeIframeAPIReady() { player = new YT.Player('player-invisible', { height: '0', width: '0', videoId: '', playerVars: { 'autoplay': 1, 'controls': 0 } }); }

        function nuevaRonda() {
            if (playlist.length === 0) return alert("¡Sin más canciones!");
            
            // Limpieza visual inmediata
            const rev = document.getElementById('revelado-datos');
            rev.style.display = 'none'; rev.innerHTML = '';

            db.ref(`salas/${miSala}/jugadores`).once('value', (snap) => {
                const j = snap.val(); if(!j) return;
                
                procesarTokensRondaAnterior();

                const ids = Object.keys(j);
                actualId = ids[indiceTurno];
                
                const randomIndex = Math.floor(Math.random() * playlist.length);
                const cancion = playlist.splice(randomIndex, 1)[0]; 

                if(player) player.loadVideoById(cancion.idYT);

                db.ref(`salas/${miSala}/estado_juego`).set({
                    fase: "JUGANDO", cancion_actual: cancion, revelar: false,
                    turno_de: actualId, nombre_turno: j[actualId].nombre,
                    posicion_bloqueada: -1, votos: {}
                });
                
                document.getElementById('aviso-turno').innerText = "TURNO DE: " + j[actualId].nombre.toUpperCase();
                indiceTurno = (indiceTurno + 1) % ids.length;
            });
        }

        function procesarTokensRondaAnterior() {
            db.ref(`salas/${miSala}/estado_juego`).once('value', (s) => {
                const e = s.val(); if(!e || !e.votos) return;
                const v = Object.values(e.votos);
                if(v.filter(x => x === true).length > v.length / 2) {
                    db.ref(`salas/${miSala}/jugadores/${e.turno_de}/tokens`).transaction(t => (t || 0) + 1);
                }
            });
        }

        function revelarAño() { db.ref(`salas/${miSala}/estado_juego/revelar`).set(true); }

        db.ref(`salas/${miSala}/estado_juego`).on('value', (snap) => {
            const e = snap.val(); if(!e) return;
            if(e.fase === "JUGANDO") { document.getElementById('btn-revelar').style.display = 'none'; document.getElementById('btn-principal').style.display = 'inline-block'; }
            if(e.fase === "ESPERA_ROBO") { document.getElementById('btn-principal').style.display = 'none'; document.getElementById('btn-revelar').style.display = 'inline-block'; }
            if(e.revelar) { 
                const rev = document.getElementById('revelado-datos');
                rev.innerHTML = `✨ ${e.cancion_actual.y} ✨<br><small>${e.cancion_actual.t}</small>`;
                rev.style.display = 'block'; 
            }
        });

        db.ref(`salas/${miSala}/jugadores`).on('value', (snap) => {
            const data = snap.val(); if(!data) return;
            const cont = document.getElementById('tablero-jugadores');
            cont.innerHTML = "";
            for (let id in data) {
                const p = data[id];
                cont.innerHTML += `<div class="jugador ${id === actualId ? 'turno-activo' : ''}"><h3>${p.nombre}</h3><div style="color:gold">🪙 Tokens: ${p.tokens}</div><div class="linea">${(p.linea || []).sort((a,b)=>a-b).map(a => `<div class="carta">${a}</div>`).join('')}</div></div>`;
            }
        });
    </script>
</body>
</html>
