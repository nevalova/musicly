<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Yo me la sé - TV Central</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { background: #121212; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; overflow: hidden; }
        .header { background: #1DB954; padding: 15px; font-size: 28px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3); text-transform: uppercase; letter-spacing: 2px; }
        .controles-tv { margin: 20px; padding: 20px; border: 2px solid #1DB954; display: inline-block; border-radius: 20px; background: #1e1e1e; }
        .tablero { display: flex; justify-content: center; gap: 15px; padding: 15px; flex-wrap: wrap; height: 60vh; overflow-y: auto; }
        .jugador { border: 2px solid #333; padding: 10px; border-radius: 12px; background: #252525; min-width: 220px; transition: 0.3s; position: relative; }
        .linea { display: flex; gap: 5px; justify-content: center; margin-top: 8px; flex-wrap: wrap; }
        .carta { background: #fff; color: #000; padding: 3px 8px; border-radius: 4px; font-weight: bold; border: 1px solid #1DB954; font-size: 12px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #1DB954; border: none; color: white; border-radius: 50px; font-weight: bold; margin: 5px; }
        #reproductor-status { margin: 10px; font-size: 20px; color: #1DB954; font-weight: bold; }
        .revelado { font-size: 40px; color: gold; font-weight: bold; margin-top: 10px; display: none; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 10px; }
        #player-invisible { position: absolute; top: -9999px; }
        .sala-tag { position: absolute; top: 10px; right: 10px; background: #333; padding: 5px 10px; border-radius: 5px; font-size: 12px; }
        .turno-activo { border-color: gold !important; box-shadow: 0 0 15px gold; transform: scale(1.02); }
        /* Pantalla de Victoria */
        #pantalla-victoria { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; justify-content: center; align-items: center; flex-direction: column; }
        .ganador-nombre { font-size: 80px; color: gold; text-shadow: 0 0 20px gold; font-weight: bold; margin: 20px 0; }
    </style>
</head>
<body>
    <div id="pantalla-victoria">
        <div style="font-size: 30px; color: #1DB954;">¡FIN DE LA PARTIDA!</div>
        <div class="ganador-nombre" id="ganador-tv">--</div>
        <div style="font-size: 24px;">🏆 ¡Es el maestro de "Yo me la sé"! 🏆</div>
        <button onclick="location.reload()" style="margin-top: 30px; font-size: 20px;">JUGAR OTRA VEZ 🔄</button>
    </div>

    <div id="sala-nombre" class="sala-tag">SALA: --</div>
    <div class="header">🎶 Yo me la sé 🎶</div>
    
    <div class="controles-tv">
        <div style="display: flex; gap: 20px; align-items: center; justify-content: center; flex-wrap: wrap;">
            <div style="background:white; padding:8px; border-radius:8px;"><div id="qrcode"></div></div>
            <button id="btn-principal" onclick="controladorPrincipal()">INICIAR JUEGO 🎮</button>
        </div>
        <div id="reproductor-status">Presiona INICIAR</div>
        <div id="revelado-datos" class="revelado"></div>
    </div>

    <div id="player-invisible"></div>
    <div class="tablero" id="tablero-jugadores"></div>

    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-database-compat.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA_WChhOabs671aPhX5uhX3FaLnn_YOc0c",
            authDomain: "party-music-3faae.firebaseapp.com",
            databaseURL: "https://party-music-3faae-default-rtdb.firebaseio.com",
            projectId: "party-music-3faae",
            storageBucket: "party-music-3faae.firebasestorage.app",
            messagingSenderId: "877613370267",
            appId: "1:877613370267:web:f096e520df8a350ba86f3e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let miSala = prompt("Sala:").toUpperCase() || "FIESTA";
        document.getElementById('sala-nombre').innerText = "SALA: " + miSala;
        db.ref(`salas/${miSala}`).remove(); // Limpiar sala al iniciar

        new QRCode(document.getElementById("qrcode"), {
            text: window.location.href.replace("index.html", "") + "mando.html?sala=" + miSala,
            width: 100, height: 100
        });

        const playlist = [
            { t: "September", a: "Earth, Wind & Fire", y: 1978, idYT: "Gs069dndIYk" },
            { t: "Take On Me", a: "a-ha", y: 1984, idYT: "djV11Xbc914" },
            { t: "Girls Just Want to Have Fun", a: "Cyndi Lauper", y: 1983, idYT: "PIb6AZdTr-A" },
            { t: "Under Pressure", a: "Queen & David Bowie", y: 1981, idYT: "a01QQZylGuI" },
            { t: "Beat It", a: "Michael Jackson", y: 1982, idYT: "oRdxUFDoQe0" },
            { t: "Smells Like Teen Spirit", a: "Nirvana", y: 1991, idYT: "hTWKbfoikeg" },
            { t: "Wannabe", a: "Spice Girls", y: 1996, idYT: "gJLIiF15wjQ" },
            { t: "Toxic", a: "Britney Spears", y: 2003, idYT: "LOZuxwVk7TU" },
            { t: "Despacito", a: "Luis Fonsi ft. Daddy Yankee", y: 2017, idYT: "kJQP7kiw5Fk" },
            { t: "Blinding Lights", a: "The Weeknd", y: 2019, idYT: "fHI8X4OXluQ" }
        ];

        let player, indiceTurno = 0, juegoIniciado = false;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player-invisible', { height: '0', width: '0', videoId: '', playerVars: { 'autoplay': 1, 'controls': 0 } });
        }

        function controladorPrincipal() {
            if (!juegoIniciado) {
                if (player && player.playVideo) { player.playVideo(); player.pauseVideo(); }
                juegoIniciado = true;
                document.getElementById('btn-principal').innerText = "SIGUIENTE CANCIÓN 🚀";
            }
            nuevaRonda();
        }

        function nuevaRonda() {
            db.ref(`salas/${miSala}/jugadores`).once('value', (snap) => {
                const j = snap.val();
                if(!j) return alert("Esperando jugadores...");
                db.ref(`salas/${miSala}/estado_juego/votos`).remove();
                db.ref(`salas/${miSala}/estado_juego/comprada`).remove();

                const ids = Object.keys(j);
                const actualId = ids[indiceTurno];
                const cancion = playlist[Math.floor(Math.random() * playlist.length)];

                if(player && player.loadVideoById) { player.loadVideoById(cancion.idYT); player.playVideo(); }

                db.ref(`salas/${miSala}/estado_juego`).set({
                    fase: "JUGANDO", cancion_actual: cancion, revelar: false,
                    turno_de: actualId, nombre_turno: j[actualId].nombre
                });
                indiceTurno = (indiceTurno + 1) % ids.length;
            });
        }

        db.ref(`salas/${miSala}/jugadores`).on('value', (snapshot) => {
            const data = snapshot.val(); if(!data) return;
            const contenedor = document.getElementById('tablero-jugadores');
            db.ref(`salas/${miSala}/estado_juego/turno_de`).once('value', (st) => {
                const idTurno = st.val();
                contenedor.innerHTML = "";
                for (let id in data) {
                    const p = data[id];
                    const cartasTotal = (p.linea || []).length;
                    
                    if(cartasTotal >= 10) { mostrarVictoria(p.nombre); }

                    const linea = (p.linea || []).sort((a,b)=>a-b).map(a => `<div class="carta">${a}</div>`).join('');
                    contenedor.innerHTML += `
                        <div class="jugador ${id === idTurno ? 'turno-activo' : ''}">
                            <h3 style="margin:5px 0;">${p.nombre}</h3>
                            <div style="color:gold; font-size:12px;">🪙 Tokens: ${p.tokens} | 🎴 Cartas: ${cartasTotal}/10</div>
                            <div class="linea">${linea}</div>
                        </div>`;
                }
            });
        });

        db.ref(`salas/${miSala}/estado_juego/revelar`).on('value', (snap) => {
            if(snap.val() === true) {
                db.ref(`salas/${miSala}/estado_juego/cancion_actual`).once('value', (s) => {
                    const c = s.val();
                    const div = document.getElementById('revelado-datos');
                    div.innerHTML = `✨ ${c.y} ✨<br><small style="font-size:18px">${c.t} - ${c.a}</small>`;
                    div.style.display = 'block';
                });
            }
        });

        function mostrarVictoria(nombre) {
            document.getElementById('pantalla-victoria').style.display = 'flex';
            document.getElementById('ganador-tv').innerText = nombre;
            db.ref(`salas/${miSala}/estado_juego/ganador`).set(nombre);
            if(player && player.stopVideo) player.stopVideo();
        }
    </script>
</body>
</html>
