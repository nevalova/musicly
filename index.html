<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yo Me La Sé - TV Mode</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
    <script src="canciones.js"></script>

    <style>
        /* 1. FONDO GRADIENTE FIXED */
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #2D004B 0%, #7B4B9E 100%);
            background-attachment: fixed;
            color: white;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            overflow-y: auto; 
            -webkit-font-smoothing: antialiased;
        }

        /* 2. MARCA DE AGUA FIXED */
        .marca-agua {
            position: fixed;
            bottom: 16px;
            right: 22px;
            font-size: 0.82rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.4);
            z-index: 50;
            pointer-events: none;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
        }

        /* 3. ESTRUCTURA PRINCIPAL (Glass Giant) */
        .seccion-juego {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .glass-panel { 
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(50px);
            -webkit-backdrop-filter: blur(50px);
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 50px; 
            width: 96vw; 
            height: 94vh; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 24px 28px;
            box-sizing: border-box;
            box-shadow: 0 0 120px rgba(0,0,0,0.6);
            z-index: 100;
        }

        .sala-tag { 
            background: #1DB954; 
            color: black; 
            font-weight: 900; 
            padding: 8px 28px; 
            border-radius: 60px; 
            font-size: 1.35rem; 
            margin-top: -10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        #instruccion-qr { 
            font-size: 0.95rem;
            font-weight: 700; 
            margin-bottom: 15px;
            opacity: 0.9;
            text-align: center;
        }

        #qr-canvas { 
            background: white; 
            padding: 15px; 
            border-radius: 25px; 
            width: 190px !important;
            height: 190px !important; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        #instruccion-turno {
            font-size: 2.15rem;
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: none;
            text-align: center;
        }

        #revelado-datos { display: none; text-align: center; }
        #display-year { font-size: 8rem; color: #FFD700; font-weight: 900; margin: 0; line-height: 0.9; text-shadow: 0 0 40px rgba(255, 215, 0, 0.4); }
        #display-song { font-size: 2.3rem; margin: 15px 0; }
        #display-artist { font-size: 1.05rem; opacity: 0.7; font-weight: 400; margin: 0; }

        #contenedor-jugadores {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .card-jugador { 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 25px; 
            padding: 10px 16px; 
            min-width: 112px; 
            text-align: center;
            font-size: 0.95rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .btn-admin { 
            background: #1DB954; 
            color: white; 
            border: none; 
            padding: 14px 28px; 
            border-radius: 20px; 
            font-weight: 900; 
            cursor: pointer; 
            margin: 0 15px; 
            font-size: 1.05rem; 
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }
        .btn-admin:hover { transform: translateY(-3px); background: #1ed760; }

        .espaciador-inferior { text-align: center; padding: 100px 0; }
    </style>
</head>
<body>

    <div class="marca-agua">un juego de El Nerdgasmo Games</div>

    <div class="seccion-juego">
        <div class="glass-panel">
            <div class="sala-tag">SALA: <span id="display-sala-id">----</span></div>
            
            <div id="zona-centro" style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;">
                
                <div id="qr-completo" style="text-align: center;">
                    <h2 id="instruccion-qr">ESCANEEN EL CÓDIGO PARA JUGAR</h2>
                    <div id="qr-container"><canvas id="qr-canvas"></canvas></div>
                </div>

                <div id="juego-activo" style="text-align: center; display: none;">
                    <h2 id="instruccion-turno">🎶 TURNO DE: ESPERANDO</h2>
                    <div id="display-eleccion" style="display:none; font-size:1.1rem; font-weight:900; color:#FFD700; margin-top:8px;"></div>
                    <div id="display-resumen" style="display:none; font-size:0.95rem; font-weight:700; color:#fff; margin-top:8px; opacity:0.9;"></div>
                    <div id="display-final" style="display:none; font-size:1.15rem; font-weight:900; color:#1DB954; margin-top:10px;"></div>
                    <div id="revelado-datos">
                        <h1 id="display-year">----</h1>
                        <h2 id="display-song">TITULO</h2>
                        <h3 id="display-artist">ARTISTA</h3>
                    </div>
                </div>
            </div>

            <div style="width: 100%; text-align: center;">
                <div id="contenedor-jugadores"></div>
                <div style="display: flex; justify-content: center;">
                    <button id="btn-iniciar-partida" class="btn-admin" onclick="iniciarPartida()">▶️ INICIAR PARTIDA</button>
                    <button id="btn-siguiente-cancion" class="btn-admin" onclick="iniciarJuego()" style="display:none;">▶️ SIGUIENTE CANCIÓN</button>
                    <button id="btn-revelar" class="btn-admin" style="background:#2196F3; display:none;" onclick="revelar()">👁️ REVELAR</button>
                </div>
            </div>
        </div>
    </div>

    <div class="espaciador-inferior">
        <div id="embed-iframe"></div>
    </div>

    <script>

        // Configuración Firebase
        const firebaseConfig = { 
            apiKey: "AIzaSyA_WChhOabs671aPhX5uhX3FaLnn_YOc0c", 
            authDomain: "party-music-3faae.firebaseapp.com", 
            databaseURL: "https://party-music-3faae-default-rtdb.firebaseio.com", 
            projectId: "party-music-3faae" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function genSala(l){ let r='', c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; for(let i=0;i<l;i++) r+=c.charAt(Math.floor(Math.random()*c.length)); return r; }
        function normalizarLinea(linea){
            return [...(linea || [])]
                .map(v => Number(v))
                .filter(v => !Number.isNaN(v))
                .sort((a,b) => a - b);
        }
        function colocacionEsValida(year, slot) {
    if (!slot) return false;

    const left = slot.left ?? null;
    const right = slot.right ?? null;

    if (left == null && right == null) return false;
    if (left == null) return year <= right;
    if (right == null) return year >= left;
    return year >= left && year <= right;
}

        function renderTarjetas(players) {
            const container = document.getElementById('contenedor-jugadores');
            container.innerHTML = "";
            listaJugadores = [];
            const arr = Object.entries(players || {}).map(([id, p]) => ({ id, ...p }));
            arr.forEach((p) => {
                listaJugadores.push({ id: p.id, nombre: p.nombre });
                const cartas = (p.linea || []).length;
                container.innerHTML += `<div class="card-jugador"><div style="font-weight:900">${p.nombre}</div><div style="color:#FFD700">🎴 ${cartas} cartas</div><div style="color:#1DB954">${p.tokens || 0} 🪙</div></div>`;
            });
        }

        const urlParams = new URLSearchParams(window.location.search);
        const salaID = (urlParams.get('s') || genSala(4)).toUpperCase();
        document.getElementById('display-sala-id').innerText = salaID;

        db.ref(`salas/${salaID}`).update({
            creada: Date.now(),
            estado_juego: { fase: "ESPERA" }
        });

        new QRious({
            element: document.getElementById('qr-canvas'),
            value: window.location.origin + window.location.pathname.replace("index.html", "") + "control.html?sala=" + salaID,
            size: 240, level: 'H'
        });

        let embedController = null;
        let listaJugadores = [];
        let indexTurno = 0;

        window.onSpotifyIframeApiReady = (IFrameAPI) => {
            IFrameAPI.createController(document.getElementById('embed-iframe'), {
                uri: 'spotify:track:4uLU6hMCxmIqC3pqr0nu9I'
            }, (c) => { embedController = c; });
        };

        function mostrarControlesJuego(activo) {
            document.getElementById('btn-iniciar-partida').style.display = activo ? "none" : "inline-block";
            document.getElementById('btn-siguiente-cancion').style.display = activo ? "inline-block" : "none";
            document.getElementById('btn-revelar').style.display = activo ? "inline-block" : "none";
        }

        function iniciarPartida() {
            mostrarControlesJuego(true);
            iniciarJuego();
        }

        async function iniciarJuego() {
            if (listaJugadores.length === 0) return alert("Esperando jugadores...");
            if (!Array.isArray(CANCIONES) || !CANCIONES.length) return alert("No hay canciones disponibles.");

            const salaSnap = await db.ref(`salas/${salaID}`).get();
            const sala = salaSnap.val() || {};
            const estadoActual = sala.estado_juego || {};
            if (estadoActual.fase === "FINAL") return alert("La partida terminó. Reinicia la sala para otra prueba.");

            const usadas = Array.isArray(sala.canciones_usadas) ? sala.canciones_usadas : [];
            const disponibles = CANCIONES.map((_, i) => i).filter(i => !usadas.includes(i));
            if (!disponibles.length) return alert("Ya se usaron todas las canciones disponibles.");

            const songIndex = disponibles[Math.floor(Math.random() * disponibles.length)];
            const cancion = CANCIONES[songIndex];
            const jugador = listaJugadores[indexTurno];
            indexTurno = (indexTurno + 1) % listaJugadores.length;

            const rondaId = "r_" + Date.now();

            await db.ref(`salas/${salaID}`).update({
                canciones_usadas: [...usadas, songIndex],
                estado_juego: {
                    fase: "JUGANDO",
                    ronda_id: rondaId,
                    cancion_idx: songIndex,
                    cancion_actual: { spotifyId: cancion.spotifyId, t: cancion.titulo, a: cancion.artista, y: cancion.year },
                    turno_de: jugador.id,
                    nombre_turno: jugador.nombre,
                    revelar: false,
                    bloqueado: false,
                    seleccion_turno: null,
                    robos: {},
                    votos: {},
                    resumen_votos: "",
                    resumen_resultado: "",
                    ganador: ""
                }
            });

            if(embedController) {
                embedController.loadUri(`spotify:track:${cancion.spotifyId}`);
                setTimeout(() => embedController.play(), 1000);
            }
        }

        async function revelar() {
            const salaRef = db.ref(`salas/${salaID}`);
            const salaSnap = await salaRef.get();
            const sala = salaSnap.val() || {};
            const e = sala.estado_juego || {};
            const players = sala.jugadores || {};
            if (!e.cancion_actual || e.revelar) return;

            const year = Number(e.cancion_actual.y);
            const lineas = {};
            Object.keys(players).forEach(id => lineas[id] = normalizarLinea(players[id].linea || []));

            const aciertos = [];

            if (e.seleccion_turno && !e.seleccion_turno.canjeado && colocacionEsValida(year, e.seleccion_turno.slot)) {
                if (lineas[e.turno_de]) {
                    lineas[e.turno_de].push(year);
                    lineas[e.turno_de].sort((a,b) => a-b);
                    aciertos.push(players[e.turno_de]?.nombre || e.nombre_turno);
                }
            }

            const robos = e.robos || {};
            Object.entries(robos).forEach(([id, robo]) => {
                if (robo && robo.slot && colocacionEsValida(year, robo.slot) && lineas[id]) {
                    lineas[id].push(year);
                    lineas[id].sort((a,b) => a-b);
                    aciertos.push((players[id]?.nombre || "Jugador") + " (robo)");
                }
            });

            const updates = {};
            Object.entries(lineas).forEach(([id, linea]) => {
                updates[`jugadores/${id}/linea`] = linea;
            });

            const votos = e.votos || {};
            const votosSi = Object.values(votos).filter(v => v === true).length;
            const votosNo = Object.values(votos).filter(v => v === false).length;

            let ganador = "";
            Object.entries(lineas).forEach(([id, linea]) => {
                if (!ganador && linea.length >= 3) {
                    ganador = players[id]?.nombre || "";
                }
            });

            const resumenResultado = aciertos.length
                ? "Carta para: " + aciertos.join(", ")
                : "Nadie ganó carta en esta ronda.";

            updates["estado_juego"] = {
                ...e,
                revelar: true,
                fase: ganador ? "FINAL" : "REVELADO",
                resumen_votos: `Votos: ${votosSi} sí / ${votosNo} no`,
                resumen_resultado: resumenResultado,
                ganador: ganador
            };

            await salaRef.update(updates);
        }

        db.ref(`salas/${salaID}/jugadores`).on('value', snap => {
            renderTarjetas(snap.val() || {});
        });

        db.ref(`salas/${salaID}/estado_juego`).on('value', snap => {
            const e = snap.val(); if(!e) return;

            const qr = document.getElementById('qr-completo');
            const juego = document.getElementById('juego-activo');
            const turno = document.getElementById('instruccion-turno');
            const eleccion = document.getElementById('display-eleccion');
            const resumen = document.getElementById('display-resumen');
            const finalMsg = document.getElementById('display-final');
            const revelado = document.getElementById('revelado-datos');

            if (e.fase === "ESPERA") {
                mostrarControlesJuego(false);
                qr.style.display = "block";
                juego.style.display = "none";
                return;
            }

            mostrarControlesJuego(true);
            qr.style.display = "none";
            juego.style.display = "block";
            turno.style.display = "block";
            turno.innerText = e.fase === "FINAL" ? "🏁 PARTIDA TERMINADA" : "🎶 TURNO DE: " + (e.nombre_turno || "Esperando");

            if (e.seleccion_turno && e.seleccion_turno.label) {
                eleccion.style.display = "block";
                eleccion.innerText = "Eligió: " + e.seleccion_turno.label;
            } else {
                eleccion.style.display = "none";
                eleccion.innerText = "";
            }

            if (e.revelar) {
                revelado.style.display = "block";
                document.getElementById('display-year').innerText = e.cancion_actual?.y ?? "----";
                document.getElementById('display-song').innerText = e.cancion_actual?.t ?? "TITULO";
                document.getElementById('display-artist').innerText = e.cancion_actual?.a ?? "ARTISTA";
                resumen.style.display = "block";
                resumen.innerHTML = `${e.resumen_resultado || ""}<br>${e.resumen_votos || ""}`;
            } else {
                revelado.style.display = "none";
                resumen.style.display = "none";
                resumen.innerHTML = "";
            }

            if (e.fase === "FINAL" && e.ganador) {
                finalMsg.style.display = "block";
                finalMsg.innerText = "Ganador: " + e.ganador + " (3 cartas totales)";
            } else {
                finalMsg.style.display = "none";
                finalMsg.innerText = "";
            }
        });

    </script>
</body>
</html>
