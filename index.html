<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Yo me la sé - TV Mode</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; margin: 0; }
        
        /* Contenedor del Reproductor para que la TV lo acepte */
        #player-container { 
            position: fixed; bottom: 10px; right: 10px; 
            width: 200px; height: 120px; border: 2px solid #333; z-index: 100;
            background: black;
        }

        .header { background: #1DB954; padding: 15px; font-size: 24px; font-weight: bold; }
        
        #setup-tv { padding: 50px; }
        input { padding: 15px; font-size: 20px; width: 300px; border-radius: 10px; border: none; }
        
        .controles-tv { 
            margin: 20px; padding: 20px; border: 2px solid #1DB954; 
            display: inline-block; border-radius: 20px; background: #1e1e1e; min-width: 80%;
        }

        #aviso-turno { font-size: 30px; color: gold; margin-bottom: 10px; }
        .tablero { display: flex; justify-content: center; gap: 15px; padding: 15px; flex-wrap: wrap; }
        .jugador { border: 2px solid #333; padding: 15px; border-radius: 15px; min-width: 180px; }
        .turno-activo { border-color: gold; transform: scale(1.05); }

        button { 
            padding: 20px 40px; font-size: 22px; cursor: pointer; background: #1DB954; 
            border: none; color: white; border-radius: 50px; font-weight: bold;
        }
        .btn-revelar { background: #f39c12; }
        .hidden { display: none !important; }
        
        #revelado-datos { 
            font-size: 35px; color: gold; background: rgba(0,0,0,0.9); 
            padding: 20px; border-radius: 20px; border: 3px solid gold;
            margin: 10px; display: none;
        }
    </style>
</head>
<body>

    <div id="setup-tv">
        <h1 style="color: #1DB954;">CONFIGURACIÓN DE SALA</h1>
        <p>Escribe el nombre de la sala usando el control o un teclado:</p>
        <input type="text" id="salaInput" placeholder="EJ: FIESTA77">
        <br><br>
        <button onclick="iniciarSala()">CREAR SALA ✅</button>
    </div>

    <div id="juego-tv" class="hidden">
        <div class="header" id="display-sala">SALA: --</div>
        <div class="controles-tv">
            <div id="aviso-turno">ESPERANDO JUGADORES...</div>
            <div style="display: flex; justify-content: center; align-items: center; gap: 30px;">
                <div id="qrcode" style="background:white; padding:10px; border-radius:10px;"></div>
                <div>
                    <button id="btn-principal" onclick="nuevaRonda()">SIGUIENTE CANCIÓN ➡️</button>
                    <button id="btn-revelar" class="btn-revelar hidden" onclick="revelarAño()">REVELAR AÑO ✨</button>
                </div>
            </div>
            <div id="revelado-datos"></div>
        </div>
        <div id="tablero-jugadores" class="tablero"></div>
    </div>

    <div id="player-container">
        <div id="player-visible"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-database-compat.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="canciones.js?v=1.2"></script>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyA_WChhOabs671aPhX5uhX3FaLnn_YOc0c", 
            authDomain: "party-music-3faae.firebaseapp.com", 
            databaseURL: "https://party-music-3faae-default-rtdb.firebaseio.com", 
            projectId: "party-music-3faae", 
            storageBucket: "party-music-3faae.firebasestorage.app", 
            messagingSenderId: "877613370267", 
            appId: "1:877613370267:web:f096e520df8a350ba86f3e" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let miSala = "";
        let playlist = [];
        let player, indiceTurno = 0, actualId = "";

        function iniciarSala() {
            miSala = document.getElementById('salaInput').value.toUpperCase().trim();
            if(!miSala) return alert("Escribe un nombre");
            
            document.getElementById('setup-tv').classList.add('hidden');
            document.getElementById('juego-tv').classList.remove('hidden');
            document.getElementById('display-sala').innerText = "SALA: " + miSala;

            db.ref(`salas/${miSala}`).remove(); // Limpiar sala vieja

            new QRCode(document.getElementById("qrcode"), { 
                text: window.location.href.replace("index.html", "") + "mando.html?sala=" + miSala, 
                width: 120, height: 120 
            });

            playlist = [...listaCancionesBase];
            escucharCambios();
        }

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player-visible', {
                height: '120', width: '200', videoId: '',
                playerVars: { 'autoplay': 1, 'controls': 0, 'origin': window.location.origin }
            });
        }

        function nuevaRonda() {
            if (playlist.length === 0) playlist = [...listaCancionesBase];
            
            db.ref(`salas/${miSala}/jugadores`).once('value', (snap) => {
                const j = snap.val();
                if(!j) return alert("¡Necesitas jugadores!");

                const ids = Object.keys(j);
                actualId = ids[indiceTurno];
                const cancion = playlist.splice(Math.floor(Math.random() * playlist.length), 1)[0]; 

                if(player) player.loadVideoById(cancion.idYT);

                db.ref(`salas/${miSala}/estado_juego`).set({
                    fase: "JUGANDO", cancion_actual: cancion, revelar: false,
                    turno_de: actualId, nombre_turno: j[actualId].nombre, votos: {}
                });

                indiceTurno = (indiceTurno + 1) % ids.length;
            });
        }

        function revelarAño() { db.ref(`salas/${miSala}/estado_juego/revelar`).set(true); }

        function escucharCambios() {
            db.ref(`salas/${miSala}/estado_juego`).on('value', (snap) => {
                const e = snap.val(); if(!e) return;
                const rev = document.getElementById('revelado-datos');
                const btnP = document.getElementById('btn-principal');
                const btnR = document.getElementById('btn-revelar');

                if(e.fase === "JUGANDO") {
                    rev.style.display = 'none';
                    btnR.classList.add('hidden');
                    btnP.classList.remove('hidden');
                    document.getElementById('aviso-turno').innerText = "TURNO DE: " + e.nombre_turno.toUpperCase();
                }
                
                if(e.fase === "ESPERA_ROBO") {
                    btnP.classList.add('hidden');
                    btnR.classList.remove('hidden');
                }

                if(e.revelar) {
                    rev.innerHTML = `✨ ${e.cancion_actual.y} ✨<br><small>${e.cancion_actual.a} - ${e.cancion_actual.t}</small>`;
                    rev.style.display = 'block';
                    btnR.classList.add('hidden');
                    btnP.classList.remove('hidden');
                    if(player) player.stopVideo();
                }
            });

            db.ref(`salas/${miSala}/jugadores`).on('value', (snap) => {
                const data = snap.val(); if(!data) return;
                const cont = document.getElementById('tablero-jugadores');
                cont.innerHTML = "";
                for (let id in data) {
                    const p = data[id];
                    cont.innerHTML += `
                        <div class="jugador ${id === actualId ? 'turno-activo' : ''}">
                            <h3 style="margin:0; color:#1DB954;">${p.nombre}</h3>
                            <div style="font-size:20px; color:gold;">🪙 ${p.tokens}</div>
                            <div style="font-size:14px;">🎴 Cartas: ${(p.linea || []).length}</div>
                        </div>`;
                }
            });
        }
    </script>
</body>
</html>
