<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yo Me La Sé - TV Mode</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-database-compat.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        /* FONDO: YouTube con desenfoque */
        #yt-player-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
            filter: blur(40px) brightness(0.4);
            transform: scale(1.2);
        }

        .main-container {
            z-index: 10;
            width: 90%;
            max-width: 1000px;
            text-align: center;
            margin-top: 50px;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 40px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .neon-text {
            text-shadow: 0 0 20px rgba(255,255,255,0.6);
            font-size: 4rem;
            font-weight: 900;
            margin-bottom: 20px;
        }

        #qr-canvas {
            background: white;
            padding: 10px;
            border-radius: 15px;
            margin-top: 20px;
        }

        #revelado-datos {
            display: none;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid rgba(255,255,255,0.2);
            animation: fadeIn 0.6s ease;
        }

        #contenedor-jugadores {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 40px;
        }

        .card-jugador {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 15px;
            min-width: 120px;
            transition: 0.3s;
        }

        .card-jugador.activo {
            border-color: #1DB954;
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(29, 185, 84, 0.4);
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="yt-player-container"><div id="player"></div></div>

    <div class="main-container">
        <h1 class="neon-text">YO ME LA SÉ</h1>
        
        <div class="glass-panel">
            <h2 id="instruccion">ESCANEEN PARA JUGAR</h2>
            <div id="qr-container"><canvas id="qr-canvas"></canvas></div>
            
            <div id="revelado-datos">
                <h1 id="display-year" style="font-size: 6rem; margin: 0; color: #FFD700;">----</h1>
                <h2 id="display-song">Título</h2>
                <h3 id="display-artist" style="opacity: 0.7;">Artista</h3>
            </div>
        </div>

        <div id="contenedor-jugadores"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA_WChhOabs671aPhX5uhX3FaLnn_YOc0c",
            authDomain: "party-music-3faae.firebaseapp.com",
            databaseURL: "https://party-music-3faae-default-rtdb.firebaseio.com",
            projectId: "party-music-3faae",
            storageBucket: "party-music-3faae.firebasestorage.app",
            messagingSenderId: "877613370267",
            appId: "1:877613370267:web:f096e520df8a350ba86f3e"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        // Ajusta esta variable según la sala que escribas en el mando
        const salaID = "SALA_GENERAL"; 

        // QR: Solo lleva al archivo del mando (sin parámetros)
        const path = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
        const urlMando = window.location.origin + path + "mando.html";

        new QRious({
            element: document.getElementById('qr-canvas'),
            value: urlMando,
            size: 180
        });

        let player;
        let cancionActual = "";

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%', width: '100%',
                playerVars: { 'autoplay': 1, 'controls': 0, 'modestbranding': 1, 'rel': 0 }
            });
        }

        // Escuchar Jugadores
        db.ref(`salas/${salaID}/jugadores`).on('value', snap => {
            const container = document.getElementById('contenedor-jugadores');
            const jugadores = snap.val();
            container.innerHTML = "";
            if(!jugadores) return;

            db.ref(`salas/${salaID}/estado_juego/turno_de`).once('value', tSnap => {
                const turnoDe = tSnap.val();
                for (let id in jugadores) {
                    const j = jugadores[id];
                    container.innerHTML += `
                        <div class="card-jugador ${id === turnoDe ? 'activo' : ''}">
                            <div style="font-size: 1.5rem; font-weight: 900;">${j.linea ? j.linea.length : 0} 🎴</div>
                            <div style="font-weight: 700;">${j.nombre}</div>
                            <div style="color: #1DB954;">${j.tokens} 🪙</div>
                        </div>`;
                }
            });
        });

        // Escuchar Juego (Sincronizado con mando.html)
        db.ref(`salas/${salaID}/estado_juego`).on('value', snap => {
            const e = snap.val();
            if (!e) return;

            if (e.fase === 'JUGANDO' && e.cancion_actual) {
                document.getElementById('instruccion').innerText = "🎶 TURNO DE: " + e.nombre_turno;
                document.getElementById('qr-container').style.display = "none";
                document.getElementById('revelado-datos').style.display = "none";
                
                if (cancionActual !== e.cancion_actual.idYT) {
                    cancionActual = e.cancion_actual.idYT;
                    if(player && player.loadVideoById) player.loadVideoById(cancionActual);
                }
            }

            if (e.revelar && e.cancion_actual) {
                document.getElementById('instruccion').innerText = "¡RESPUESTA!";
                document.getElementById('display-year').innerText = e.cancion_actual.y;
                document.getElementById('display-song').innerText = e.cancion_actual.t;
                document.getElementById('display-artist').innerText = e.cancion_actual.a;
                document.getElementById('revelado-datos').style.display = "block";
                if(player) player.pauseVideo();
            }

            if (e.fase === 'ESPERA' || !e.fase) {
                document.getElementById('instruccion').innerText = "ESCANEEN PARA JUGAR";
                document.getElementById('qr-container').style.display = "block";
                document.getElementById('revelado-datos').style.display = "none";
                if(player) player.stopVideo();
            }
        });
    </script>
</body>
</html>
